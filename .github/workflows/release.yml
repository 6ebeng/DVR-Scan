# Build Complete Release for DVR-Scan (Fork)
# Creates: MSI installer (x64), EXE installer, portable ZIP, Python wheels, and source archives
name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.8.1)'
        required: false
        default: ''

env:
  ffmpeg_version: "7.1"
  UV_SYSTEM_PYTHON: 1

jobs:
  # ============================================================
  # Build Windows x64 Portable
  # ============================================================
  build-windows-x64:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Install Dependencies
        run: |
          uv pip install --upgrade pip build wheel virtualenv setuptools pyinstaller
          uv pip install -r dist/requirements_windows.txt -r docs/requirements.txt

      - name: Download FFMPEG
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: 'GyanD/codexffmpeg'
          version: 'tags/${{ env.ffmpeg_version }}'
          file: 'ffmpeg-${{ env.ffmpeg_version }}-full_build.7z'

      - name: Extract FFMPEG
        run: |
          7z e ffmpeg-${{ env.ffmpeg_version }}-full_build.7z ffmpeg.exe -r
          7z e -odist/ffmpeg ffmpeg-${{ env.ffmpeg_version }}-full_build.7z LICENSE -r

      - name: Unit Test
        run: python -m pytest tests/

      - name: Build DVR-Scan
        run: |
          python dist/pre_release.py --use-local-images
          pyinstaller dist/dvr-scan.spec
          python dist/post_release.py

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import dvr_scan; print(dvr_scan.__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > dist/dvr-scan/VERSION

      - name: Assemble Distribution
        run: |
          Move-Item -Path ffmpeg.exe -Destination dist/dvr-scan/ffmpeg.exe
          Move-Item -Path dist/ffmpeg/LICENSE -Destination dist/dvr-scan/LICENSE-FFMPEG -Force
          cd dist/dvr-scan
          7z a ../DVR-Scan-win64.zip *

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/DVR-Scan-win64.zip

      - name: Upload Build Files
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/dvr-scan/

  # ============================================================
  # Build Installers (x64) using Inno Setup and WiX
  # ============================================================
  build-installers:
    runs-on: windows-latest
    needs: build-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Files
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/dvr-scan

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(cat dist/dvr-scan/VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build EXE Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Build installer using the ISS template with version passed as define
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "dist\installer\dvr-scan-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Build MSI Installer (WiX 3)
        shell: pwsh
        continue-on-error: true
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $msiVersion = $version -replace '[^0-9.]', ''
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+') { 
            $parts = $msiVersion -split '\.'
            while ($parts.Count -lt 3) { $parts += "0" }
            $msiVersion = ($parts[0..2]) -join '.'
          }
          
          Write-Host "Building MSI version: $msiVersion"
          
          $wixBin = "${env:WIX}bin\"
          if (-not (Test-Path $wixBin)) {
            Write-Host "WiX not found at $wixBin, skipping MSI build"
            exit 0
          }
          
          # Harvest all files with heat.exe
          & "${wixBin}heat.exe" dir "dist\dvr-scan" -cg AllFiles -dr INSTALLFOLDER -gg -sfrag -srd -sreg -var var.SourceDir -out "files.wxs"
          if ($LASTEXITCODE -ne 0) { throw "heat.exe failed" }
          
          # Compile WiX sources using template
          & "${wixBin}candle.exe" -arch x64 -dSourceDir="dist\dvr-scan" -dProductVersion="$msiVersion" "dist\installer\product.wxs" files.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed" }
          
          # Link to create MSI
          & "${wixBin}light.exe" -ext WixUIExtension -out "dist\DVR-Scan-win64.msi" product.wixobj files.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed" }
          
          Write-Host "MSI build completed successfully"

      - name: Upload EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: dist/DVR-Scan-win64-setup.exe

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: installer-msi
          path: dist/DVR-Scan-win64.msi

  # ============================================================
  # Build Python Packages (wheels and source)
  # ============================================================
  build-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Install Dependencies
        run: |
          uv pip install --upgrade build wheel virtualenv
          uv pip install opencv-python-headless opencv-contrib-python-headless --only-binary :all:
          uv pip install -r requirements_headless.txt -r docs/requirements.txt

      - name: Build Standard Package
        run: |
          python dist/pre_release.py
          python -m build
          # Move to separate folder
          mkdir -p pkg
          mv dist/*.whl dist/*.tar.gz pkg/

      - name: Build Headless Package
        run: |
          python dist/tweak_setup_cfg_for_headless.py
          python -m build
          mv dist/*.whl dist/*.tar.gz pkg/
          git reset --hard HEAD

      - name: Upload Python Packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: pkg/

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-installers, build-python]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          VERSION=${{ needs.build-windows-x64.outputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-release}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          
          # Rename and copy files with version
          [ -f artifacts/portable-zip/DVR-Scan-win64.zip ] && \
            cp artifacts/portable-zip/DVR-Scan-win64.zip "release/DVR-Scan-${VERSION}-win64.zip"
          
          [ -f artifacts/installer-exe/DVR-Scan-win64-setup.exe ] && \
            cp artifacts/installer-exe/DVR-Scan-win64-setup.exe "release/DVR-Scan-${VERSION}-win64-setup.exe"
          
          [ -f artifacts/installer-msi/DVR-Scan-win64.msi ] && \
            cp artifacts/installer-msi/DVR-Scan-win64.msi "release/DVR-Scan-${VERSION}-win64.msi"
          
          # Copy Python packages
          cp artifacts/python-packages/*.whl release/ 2>/dev/null || true
          cp artifacts/python-packages/*.tar.gz release/ 2>/dev/null || true
          
          echo "Release files:"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DVR-Scan v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: false
          files: release/*
          body: |
            ## DVR-Scan v${{ steps.version.outputs.version }}
            
            ### Downloads
            
            | File | Description |
            |------|-------------|
            | `DVR-Scan-${{ steps.version.outputs.version }}-win64.msi` | Windows x64 MSI Installer |
            | `DVR-Scan-${{ steps.version.outputs.version }}-win64-setup.exe` | Windows x64 Setup Installer |
            | `DVR-Scan-${{ steps.version.outputs.version }}-win64.zip` | Windows x64 Portable |
            | `dvr_scan-*.whl` | Python Wheel |
            | `dvr_scan_headless-*.whl` | Python Wheel (Headless/No GUI) |
            | `dvr_scan-*.tar.gz` | Python Source |
            
            ### Installation
            
            **Windows:** Download the MSI installer, setup EXE, or portable ZIP.
            
            **Python:** 
            ```bash
            pip install dvr-scan
            # or for headless (no GUI):
            pip install dvr-scan-headless
            ```
            
            ### Changelog
            
            See [CHANGELOG](https://github.com/6ebeng/DVR-Scan/blob/main/docs/changelog.md) for details.
